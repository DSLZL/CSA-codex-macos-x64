name: Build macOS x64 patched Codex

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-hex CSA-codex source commit
        required: true
        type: string
      compat_id:
        description: Exact compatibility ID
        required: true
        type: string
      request_id:
        description: Unique central build request ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: DSLZL/CSA-codex/.github/workflows/build-patched-codex-target.yml@49d27c2c76c4ac0f1c1e997c2cdc7874fd4f0b09
    with:
      builder_repository: DSLZL/CSA-codex-macos-x64
      cache_mode: read-write
      compat_id: ${{ inputs.compat_id }}
      request_id: ${{ inputs.request_id }}
      retention_days: 1
      runner: macos-26-intel
      source_commit: ${{ inputs.source_commit }}
      target: x86_64-apple-darwin
